<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت هوشمند تکالیف</title>
    <style>
        :root { --bg-color: #f4f6fa; --container-bg: #ffffff; --primary-color: #4f46e5; --success-color: #10b981; --danger-color: #ef4444; --text-main: #1f2937; --text-muted: #6b7280; --border-color: #e5e7eb; }
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px 12px; display: flex; justify-content: center; }
        .app-container { background: var(--container-bg); width: 100%; max-width: 480px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 24px; border: 1px solid var(--border-color); }
        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 22px; color: var(--primary-color); margin-bottom: 6px; }
        header p { font-size: 13px; color: var(--text-muted); }
        .form-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; background: #f9fafb; padding: 16px; border-radius: 14px; border: 1px solid var(--border-color); }
        .form-control { display: flex; flex-direction: column; gap: 6px; }
        .form-control label { font-size: 13px; font-weight: bold; color: #4b5563; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 14px; outline: none; background: white; }
        .btn-add { background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .section-title { font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; }
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .task-item { background: white; border: 1px solid var(--border-color); padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-right: 5px solid var(--primary-color); }
        .task-item.completed { border-right-color: var(--success-color); opacity: 0.6; }
        .task-item.completed .task-title { text-decoration: line-through; }
        .task-content { display: flex; flex-direction: column; gap: 4px; max-width: 65%; }
        .task-title { font-size: 14px; font-weight: 600; }
        .task-deadline { font-size: 11px; color: var(--danger-color); }
        .task-remind { font-size: 11px; color: #4f46e5; font-weight: bold; }
        .btn-action { border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .btn-complete { background: #e6f4ea; color: var(--success-color); }
        .btn-delete { background: #fce8e6; color: var(--danger-color); }
    </style>
</head>
<body>
<div class="app-container">
    <header>
        <h1>⏰ دستیار تکالیف و ددلاین</h1>
        <p>برنامه‌ریزی دقیق و تیک زدن اهداف</p>
    </header>
    <div class="form-group">
        <div class="form-control">
            <label>📌 موضوع تکلیف یا تمرین:</label>
            <input type="text" id="taskTitle" placeholder="مثلاً: تمرین صفحه ۴۵ ریاضی">
        </div>
        <div class="form-control">
            <label>📅 تاریخ و ساعت ددلاین (تحویل):</label>
            <input type="datetime-local" id="taskDeadline">
        </div>
        <div class="form-control">
            <label>🔔 زمان یادآوری:</label>
            <select id="remindTime">
                <option value="0">دقیقاً در زمان ددلاین</option>
                <option value="10">۱۰ دقیقه قبل از ددلاین</option>
                <option value="60">۱ ساعت قبل از ددلاین</option>
                <option value="1440">۱ روز قبل از ددلاین</option>
            </select>
        </div>
        <button class="btn-add" onclick="createNewTask()">➕ افزودن تکلیف جدید</button>
    </div>
    <div class="section-title">📋 لیست تکالیف شما</div>
    <ul class="task-list" id="taskListContainer"></ul>
</div>
<script>
    let tasks = [];
    document.addEventListener('DOMContentLoaded', () => {
        tasks = JSON.parse(localStorage.getItem('smart_tasks') || '[]');
        renderTasks();
        setInterval(checkDeadlines, 10000); // هر ۱۰ ثانیه چک میکنه
    });

    function createNewTask() {
        const title = document.getElementById('taskTitle');
        const deadline = document.getElementById('taskDeadline');
        const remindMinutes = document.getElementById('remindTime').value;
        
        if (!title.value.trim()) return alert('لطفاً موضوع تکلیف رو وارد کن');
        if (!deadline.value) return alert('لطفاً تاریخ ددلاین رو مشخص کن');

        // محاسبه زمان دقیق یادآوری
        const deadlineDate = new Date(deadline.value);
        const remindDate = new Date(deadlineDate.getTime() - remindMinutes * 60000);

        tasks.push({ 
            id: Date.now(), 
            title: title.value.trim(), 
            deadline: deadline.value, 
            remindAt: remindDate.toISOString(),
            remindText: document.getElementById('remindTime').options[document.getElementById('remindTime').selectedIndex].text,
            completed: false,
            notified: false
        });
        
        localStorage.setItem('smart_tasks', JSON.stringify(tasks));
        renderTasks();
        title.value = ''; deadline.value = '';
    }

    function toggleComplete(id) {
        tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
        localStorage.setItem('smart_tasks', JSON.stringify(tasks));
        renderTasks();
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        localStorage.setItem('smart_tasks', JSON.stringify(tasks));
        renderTasks();
    }

    function renderTasks() {
        const container = document.getElementById('taskListContainer');
        container.innerHTML = tasks.length === 0 ? '<div style="text-align:center;color:#6b7280;">لیست خالی است✨</div>' : '';
        tasks.forEach(t => {
            const li = document.createElement('li');
            li.className = `task-item ${t.completed ? 'completed' : ''}`;
            li.innerHTML = `
                <div class="task-content">
                    <span class="task-title">${t.title}</span>
                    <span class="task-deadline">📅 ددلاین: ${t.deadline.replace('T', ' ')}</span>
                    <span class="task-remind">🔔 یادآوری: ${t.remindText}</span>
                </div>
                <div>
                    <button class="btn-action btn-complete" onclick="toggleComplete(${t.id})">${t.completed ? '↩️' : '✅'}</button>
                    <button class="btn-action btn-delete" onclick="deleteTask(${t.id})">🗑️</button>
                </div>
            `;
            container.appendChild(li);
        });
    }

    function checkDeadlines() {
        const now = new Date();
        tasks.forEach(t => {
            if (!t.completed && !t.notified && t.remindAt) {
                if (now >= new Date(t.remindAt)) {
                    t.notified = true;
                    localStorage.setItem('smart_tasks', JSON.stringify(tasks));
                    alert(`⏰ زمان یادآوری تکلیف فرا رسید!\n\n📌 موضوع: ${t.title}\n📅 ددلاین: ${t.deadline.replace('T', ' ')}`);
                }
            }
        });
    }
</script>
</body>
</html>
